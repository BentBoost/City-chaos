
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CITY CHAOS 0.3</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  overflow: hidden;
  background: #050509;
  color: white;
  font-family: Arial, sans-serif;
}
#game { width: 100vw; height: 100vh; display: block; }
#hud {
  position: absolute;
  top: 15px;
  left: 15px;
  z-index: 5;
  background: rgba(5,5,12,.82);
  border: 1px solid #a52b55;
  border-radius: 9px;
  padding: 12px 16px;
  min-width: 180px;
  box-shadow: 0 0 18px #a52b5544;
}
#title { color: #ff315f; font-weight: bold; font-size: 21px; letter-spacing: 2px; }
#stats { margin-top: 8px; line-height: 1.7; font-size: 14px; }
#mission {
  position: absolute;
  top: 15px;
  right: 15px;
  z-index: 5;
  background: rgba(5,5,12,.85);
  border: 1px solid #e0a52e;
  border-radius: 9px;
  padding: 12px;
  max-width: 230px;
  font-size: 13px;
}
#message {
  position: absolute;
  top: 125px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 6;
  background: rgba(0,0,0,.8);
  padding: 10px 18px;
  border-radius: 8px;
  color: #fff;
  text-align: center;
  display: none;
}
#help {
  position: absolute;
  bottom: 12px;
  left: 12px;
  z-index: 5;
  background: rgba(0,0,0,.7);
  padding: 9px 12px;
  border-radius: 7px;
  font-size: 12px;
  line-height: 1.6;
}
#mobile {
  display: none;
  position: absolute;
  bottom: 20px;
  right: 15px;
  z-index: 10;
  gap: 8px;
  align-items: end;
}
.pad { display: grid; grid-template-columns: repeat(3,48px); gap: 5px; }
.mobileBtn {
  width: 48px;
  height: 48px;
  border: 1px solid #ff315f;
  border-radius: 10px;
  background: #17131ddd;
  color: white;
  font-size: 18px;
  touch-action: none;
}
.mobileBtn:active { background: #9d2045; }
.actions { display: flex; flex-direction: column; gap: 6px; }
@media (pointer: coarse) {
  #mobile { display: flex; }
  #help { display: none; }
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="title">CITY CHAOS</div>
  <div style="color:#aaa;font-size:11px;">VERSION 0.3 — NIGHT CITY</div>
  <div id="stats">
    Geld: €<span id="money">500</span><br>
    Voertuig: <span id="vehicle">Te voet</span><br>
    Politie: <span id="wanted">☆☆☆☆☆</span>
  </div>
</div>

<div id="mission">
  <strong style="color:#ffc34d;">MISSIE 01</strong>
  <p id="missionText">Ga naar de gele marker om je eerste opdracht te starten.</p>
  <small style="color:#aaa;">Beloning: €750</small>
</div>

<div id="message"></div>

<div id="help">
  Z / S — Vooruit / achteruit<br>
  Q / D — Links / rechts<br>
  SHIFT — Sprinten<br>
  SPACE — Springen<br>
  E — Auto in- of uitstappen<br>
  V — Camera wisselen
</div>

<div id="mobile">
  <div class="pad">
    <div></div><button class="mobileBtn" data-key="z">▲</button><div></div>
    <button class="mobileBtn" data-key="q">◀</button>
    <button class="mobileBtn" data-key="s">▼</button>
    <button class="mobileBtn" data-key="d">▶</button>
  </div>
  <div class="actions">
    <button class="mobileBtn" data-key="e">AUTO</button>
    <button class="mobileBtn" data-key="shift">RUN</button>
    <button class="mobileBtn" data-key="v">CAM</button>
  </div>
</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
(() => {
"use strict";

const canvas = document.getElementById("game");
const engine = new BABYLON.Engine(canvas, true);
const scene = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color4(0.012, 0.012, 0.025, 1);
scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
scene.fogDensity = 0.008;
scene.fogColor = new BABYLON.Color3(0.025, 0.025, 0.06);

const camera = new BABYLON.FollowCamera(
  "camera", new BABYLON.Vector3(0, 8, -12), scene
);
camera.radius = 13;
camera.heightOffset = 5;
camera.rotationOffset = 180;
camera.cameraAcceleration = 0.08;
camera.maxCameraSpeed = 8;
scene.activeCamera = camera;

const light = new BABYLON.HemisphericLight(
  "moonLight", new BABYLON.Vector3(0, 1, 0), scene
);
light.intensity = 0.38;

const moon = new BABYLON.PointLight(
  "cityGlow", new BABYLON.Vector3(0, 25, 0), scene
);
moon.diffuse = new BABYLON.Color3(0.25, 0.28, 0.55);
moon.intensity = 0.7;

function material(name, color, emissive = null) {
  const m = new BABYLON.StandardMaterial(name, scene);
  m.diffuseColor = BABYLON.Color3.FromHexString(color);
  if (emissive) m.emissiveColor = BABYLON.Color3.FromHexString(emissive);
  return m;
}

const asphalt = material("asphalt", "#171821");
const pavement = material("pavement", "#30303a");
const dark = material("darkBuildings", "#252431");
const dark2 = material("darkBuildings2", "#34303c");
const windowMat = material("windows", "#f3a64c", "#7a3a18");
const neonPink = material("pinkNeon", "#ff3479", "#ff155b");
const neonBlue = material("blueNeon", "#29aaff", "#0879ff");
const playerMat = material("player", "#35a8ff");
const carMat = material("car", "#b51d35");
const policeMat = material("police", "#151a2b");
const yellow = material("missionYellow", "#ffca35", "#ffad00");

const ground = BABYLON.MeshBuilder.CreateGround(
  "ground", {width: 240, height: 240}, scene
);
ground.material = asphalt;

function box(name, x, y, z, w, h, d, mat) {
  const mesh = BABYLON.MeshBuilder.CreateBox(
    name, {width:w, height:h, depth:d}, scene
  );
  mesh.position.set(x, y, z);
  mesh.material = mat;
  return mesh;
}

// Straten en trottoirs
for (let i = -100; i <= 100; i += 40) {
  box("roadX", 0, .02, i, 240, .05, 13, asphalt);
  box("roadZ", i, .03, 0, 13, .05, 240, asphalt);
  box("sidewalkX", 0, .08, i + 8, 240, .15, 3, pavement);
  box("sidewalkX2", 0, .08, i - 8, 240, .15, 3, pavement);
  box("sidewalkZ", i + 8, .08, 0, 3, .15, 240, pavement);
  box("sidewalkZ2", i - 8, .08, 0, 3, .15, 240, pavement);
}

// Straatmarkeringen
const lineMat = material("roadLines", "#d7c58d", "#51442b");
for (let i = -100; i <= 100; i += 40) {
  for (let n = -110; n <= 110; n += 10) {
    box("roadLine", n, .07, i, 4, .025, .18, lineMat);
    box("roadLine", i, .07, n, .18, .025, 4, lineMat);
  }
}

// Willekeurig geplaatste stadsgebouwen
let seed = 42;
function random() {
  seed = (seed * 16807) % 2147483647;
  return (seed - 1) / 2147483646;
}

for (let x = -90; x <= 90; x += 40) {
  for (let z = -90; z <= 90; z += 40) {
    if (Math.abs(x) < 18 && Math.abs(z) < 18) continue;

    for (const sx of [-1, 1]) {
      for (const sz of [-1, 1]) {
        const bx = x + sx * (12 + random() * 3);
        const bz = z + sz * (12 + random() * 3);
        const w = 10 + random() * 5;
        const d = 10 + random() * 5;
        const h = 12 + random() * 35;
        const b = box(
          "cityBuilding", bx, h/2, bz, w, h, d,
          random() > .5 ? dark : dark2
        );

        // Verlichte ramen aan de voorzijde
        for (let floor = 2; floor < h - 2; floor += 4) {
          for (let win = -1; win <= 1; win++) {
            if (random() > .35) {
              const wm = random() > .5 ? windowMat : neonBlue;
              box("buildingWindow",
                bx + win * 2.5, floor, bz - d/2 - .04,
                1.1, 1.4, .08, wm);
            }
          }
        }
      }
    }
  }
}

// Neonborden
function sign(x, y, z, text, mat) {
  const board = box("neonSign", x, y, z, 7, 2, .25, mat);
  const plane = BABYLON.MeshBuilder.CreatePlane(
    "signText", {width:6.5, height:1.5}, scene
  );
  plane.position.set(x, y, z - .17);
  const tex = new BABYLON.DynamicTexture(
    "signTexture", {width:512, height:128}, scene
  );
  tex.drawText(text, null, 88, "bold 58px Arial", "#ffffff", "#111018", true);
  const tm = new BABYLON.StandardMaterial("signMaterial", scene);
  tm.diffuseTexture = tex;
  tm.emissiveTexture = tex;
  plane.material = tm;
}
sign(9, 7, 5, "NIGHT CLUB", neonPink);
sign(-9, 7, -5, "24 / 7", neonBlue);

// Straatlantaarns
const lampMat = material("lampGlow", "#ffdb9a", "#ffbd65");
for (let i = -100; i <= 100; i += 40) {
  for (const side of [-1, 1]) {
    const x = i + side * 11;
    box("lampPost", x, 3, 0, .18, 6, .18, dark2);
    box("lampHead", x, 6, 0, 1.1, .25, .5, lampMat);
  }
}

// Speler
const player = BABYLON.MeshBuilder.CreateCapsule(
  "player", {height:2, radius:.45}, scene
);
player.position.set(0, 1, 0);
player.material = playerMat;
camera.lockedTarget = player;

// Auto maken
function makeCar(name, x, z, bodyMat) {
  const root = new BABYLON.TransformNode(name, scene);
  const body = BABYLON.MeshBuilder.CreateBox(
    name + "Body", {width:2.2, height:.8, depth:4.2}, scene
  );
  body.position.y = .8;
  body.material = bodyMat;
  body.parent = root;

  const roof = BABYLON.MeshBuilder.CreateBox(
    name + "Roof", {width:1.7, height:.8, depth:2}, scene
  );
  roof.position.set(0, 1.5, -.2);
  roof.material = dark2;
  roof.parent = root;

  for (const wx of [-1, 1]) {
    for (const wz of [-1.35, 1.35]) {
      const wheel = BABYLON.MeshBuilder.CreateCylinder(
        name + "Wheel", {diameter:.75, height:.25, tessellation:12}, scene
      );
      wheel.rotation.z = Math.PI/2;
      wheel.position.set(wx*1.08, .45, wz);
      wheel.material = material(name+"WheelMat", "#08080b");
      wheel.parent = root;
    }
  }

  root.position.set(x, 0, z);
  return root;
}

const car = makeCar("playerCar", 5, 3, carMat);
const traffic = [
  makeCar("traffic1", -18, 10, material("trafficRed","#7d2530")),
  makeCar("traffic2", 30, -20, material("trafficBlue","#254b70")),
  makeCar("traffic3", -50, 50, material("trafficGrey","#77717a"))
];

// Politieauto
const police = makeCar("policeCar", 40, 40, policeMat);
const policeLightRed = box("policeRed", 0, 2, 0, .7, .2, .4, neonPink);
policeLightRed.parent = police;
const policeLightBlue = box("policeBlue", .7, 2, 0, .7, .2, .4, neonBlue);
policeLightBlue.parent = police;
police.setEnabled(false);

// Wandelende NPC's
const npcs = [];
for (let i = 0; i < 12; i++) {
  const npc = BABYLON.MeshBuilder.CreateCapsule(
    "pedestrian", {height:1.8, radius:.35}, scene
  );
  npc.position.set(-65 + random()*130, .9, -65 + random()*130);
  npc.material = material("npcMat"+i,
    ["#a36c4d","#6b8b9d","#8874a5","#b0a37a"][i%4]);
  npcs.push({
    mesh:npc,
    angle:random()*Math.PI*2,
    speed:1 + random()
  });
}

// Missiemarker
const marker = BABYLON.MeshBuilder.CreateCylinder(
  "missionMarker", {diameter:2.5, height:.15, tessellation:32}, scene
);
marker.position.set(25, .2, 25);
marker.material = yellow;

const markerRing = BABYLON.MeshBuilder.CreateTorus(
  "missionRing", {diameter:3.2, thickness:.12}, scene
);
markerRing.position.set(25, .3, 25);
markerRing.material = neonPink;

// Spelersysteem
const keys = {};
let money = 500;
let wanted = 0;
let inCar = false;
let firstPerson = false;
let missionDone = false;
let jumpVelocity = 0;
let playerSpeed = 8;
let carSpeed = 0;
let policeActive = false;
let messageTimer = 0;

function say(text) {
  const el = document.getElementById("message");
  el.textContent = text;
  el.style.display = "block";
  messageTimer = 3;
}

function updateHUD() {
  document.getElementById("money").textContent = money;
  document.getElementById("vehicle").textContent = inCar ? "Auto" : "Te voet";
  document.getElementById("wanted").textContent =
    "★".repeat(wanted) + "☆".repeat(5-wanted);
}

window.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if ([" ","arrowup","arrowdown","arrowleft","arrowright"].includes(k)) {
    e.preventDefault();
  }
  if (k === "e" && !e.repeat) toggleCar();
  if (k === "v" && !e.repeat) toggleCamera();
  if (k === " " && !e.repeat && !inCar && player.position.y <= 1.05) {
    jumpVelocity = 8;
  }
});

window.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

document.querySelectorAll(".mobileBtn").forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener("pointerdown", e => {
    e.preventDefault();
    if (key === "e") toggleCar();
    else if (key === "v") toggleCamera();
    else keys[key] = true;
  });
  ["pointerup","pointerleave","pointercancel"].forEach(type => {
    btn.addEventListener(type, () => { keys[key] = false; });
  });
});

function toggleCamera() {
  firstPerson = !firstPerson;
  if (firstPerson) {
    camera.radius = .3;
    camera.heightOffset = 1.6;
  } else {
    camera.radius = 13;
    camera.heightOffset = 5;
  }
}

function toggleCar() {
  if (!inCar) {
    if (BABYLON.Vector3.Distance(player.position, car.position) < 5) {
      inCar = true;
      player.setEnabled(false);
      say("Je bent ingestapt. Tijd om te rijden!");
    } else {
      say("Ga dichter bij je auto staan.");
    }
  } else {
    inCar = false;
    player.setEnabled(true);
    player.position.copyFrom(car.position);
    player.position.x += 3;
    say("Je bent uitgestapt.");
  }
  updateHUD();
}

function clampWorld(mesh) {
  mesh.position.x = BABYLON.Scalar.Clamp(mesh.position.x, -112, 112);
  mesh.position.z = BABYLON.Scalar.Clamp(mesh.position.z, -112, 112);
}

function updatePlayer(dt) {
  if (inCar) return;

  let forward = 0, side = 0;
  if (keys["z"]) forward++;
  if (keys["s"]) forward--;
  if (keys["d"]) side++;
  if (keys["q"]) side--;

  const direction = new BABYLON.Vector3(side, 0, forward);
  if (direction.length() > 0) {
    direction.normalize();
    const speed = keys["shift"] ? 13 : playerSpeed;
    player.position.addInPlace(direction.scale(speed*dt));
    player.rotation.y = Math.atan2(direction.x, direction.z);
  }

  jumpVelocity -= 18 * dt;
  player.position.y += jumpVelocity * dt;
  if (player.position.y < 1) {
    player.position.y = 1;
    jumpVelocity = 0;
  }
  clampWorld(player);
}

function updateCar(dt) {
  if (!inCar) return;

  if (keys["z"]) carSpeed += 18*dt;
  else if (keys["s"]) carSpeed -= 18*dt;
  else carSpeed *= Math.pow(.94, dt*60);

  carSpeed = BABYLON.Scalar.Clamp(carSpeed, -12, 27);

  const turn = (keys["d"] ? 1 : 0) - (keys["q"] ? 1 : 0);
  car.rotation.y += turn * dt * Math.min(2.3, Math.abs(carSpeed)*.12);
  const forward = new BABYLON.Vector3(
    Math.sin(car.rotation.y), 0, Math.cos(car.rotation.y)
  );
  car.position.addInPlace(forward.scale(carSpeed*dt));
  clampWorld(car);

  if (Math.abs(carSpeed) > 12 && !policeActive) {
    wanted = Math.max(wanted, 1);
    activatePolice();
  }
}

function activatePolice() {
  if (policeActive) return;
  policeActive = true;
  police.setEnabled(true);
  say("POLITIE ALERT! Je wordt gezocht!");
  updateHUD();
}

function updatePolice(dt) {
  if (!policeActive) return;
  const target = inCar ? car : player;
  const direction = target.position.subtract(police.position);
  direction.y = 0;
  const distance = direction.length();

  if (distance > 2) {
    direction.normalize();
    police.position.addInPlace(direction.scale(7*dt));
    police.rotation.y = Math.atan2(direction.x, direction.z);
  }

  if (distance < 4) {
    wanted = Math.min(5, wanted + 1);
    money = Math.max(0, money - 25);
    say("De politie heeft je ingehaald! Je verliest €25.");
    police.position.x -= 8;
    police.position.z -= 8;
    updateHUD();
  }
}

function updateNPCs(dt) {
  for (const npc of npcs) {
    npc.angle += (Math.random() - .5) * dt * .5;
    npc.mesh.position.x += Math.sin(npc.angle) * npc.speed * dt;
    npc.mesh.position.z += Math.cos(npc.angle) * npc.speed * dt;
    if (Math.abs(npc.mesh.position.x) > 105 ||
        Math.abs(npc.mesh.position.z) > 105) {
      npc.angle += Math.PI;
    }
    npc.mesh.rotation.y = npc.angle;
  }
}

function updateTraffic(dt) {
  traffic.forEach((vehicle, i) => {
    vehicle.position.x += (i % 2 === 0 ? 1 : -1) * 4 * dt;
    if (vehicle.position.x > 110) vehicle.position.x = -110;
    if (vehicle.position.x < -110) vehicle.position.x = 110;
  });
}

function updateMission() {
  const target = inCar ? car : player;
  if (!missionDone &&
      BABYLON.Vector3.Distance(target.position, marker.position) < 4) {
    missionDone = true;
    marker.setEnabled(false);
    markerRing.setEnabled(false);
    money += 750;
    wanted = Math.max(wanted, 1);
    document.getElementById("missionText").textContent =
      "Opdracht voltooid! Je hebt €750 verdiend. Nieuwe opdrachten volgen.";
    say("MISSIE VOLTOOID! +€750");
    activatePolice();
    updateHUD();
  }
}

let lastTime = performance.now();
engine.runRenderLoop(() => {
  const now = performance.now();
  const dt = Math.min((now-lastTime)/1000, .04);
  lastTime = now;

  updatePlayer(dt);
  updateCar(dt);
  updatePolice(dt);
  updateNPCs(dt);
  updateTraffic(dt);
  updateMission();

  marker.rotation.y += dt;
  markerRing.rotation.y -= dt*.5;

  if (messageTimer > 0) {
    messageTimer -= dt;
    if (messageTimer <= 0) {
      document.getElementById("message").style.display = "none";
    }
  }

  camera.lockedTarget = inCar ? car : player;
  scene.render();
});

window.addEventListener("resize", () => engine.resize());
updateHUD();
say("Welkom in de stad. Zoek de gele missie-marker!");
})();
</script>
</body>
</html>
